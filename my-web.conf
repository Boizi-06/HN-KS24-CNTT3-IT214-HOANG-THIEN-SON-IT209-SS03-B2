server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/my-web/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cấu hình trang lỗi tùy chỉnh 404
    error_page 404 /404.html;

    # Bảo vệ tệp tin lỗi bằng chỉ thị internal
    # Ngăn người dùng truy cập trực tiếp bằng URL http://<IP>/404.html
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }

    access_log /var/log/nginx/my-web.access.log;
    error_log /var/log/nginx/my-web.error.log;
}
